---

terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: gcp64-03-2026-terraform

vars:
  deployment_name: a3-ultra-vm # supply unique deployment name
  project_id: projectseald
  region: us-south1
  zone: us-south1-b
  a3u_reservation_name: # supply a3-ultragpu-8g reservation name
  a3u_provisioning_model: RESERVATION_BOUND # if you have a reservation, keep RESERVATION_BOUND. IF you do NOT have a reservation,set this to SPOT
  number_of_vms: 8
