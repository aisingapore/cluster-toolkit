---
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: gcp0626-a3h 

vars:
  # [RECOMMENDED] Enable Slurm Native Authentication. MUNGE is deprecating and scheduled for complete removal on July 31, 2026.
  # For upgrade instructions, see docs/slurm-native-auth-migration-guide.md.
  enable_slurm_auth: true
  deployment_name: a3high-slurm-gcsfuse
  project_id: projectseald  # specify the project id
  region: us-east5  # supply region with a3-highgpu-8g capacity in reservation
  zone: us-east5-a  # supply zone with a3-highgpu-8g capacity in reservation
  # Credentials for the private TCPX kernel PPA. These are shared values
  # supplied by Google Cloud staff (not user/project specific).
  tcpx_kernel_login: # supplied by deploy.local.sh from .env
  tcpx_kernel_password: # supplied by deploy.local.sh from .env
  keyserver_ubuntu_key: # supplied by deploy.local.sh from .env
  a3_reservation_name:  a3high-res # supply a3-highgpu-8g reservation name
  slurm_cluster_name: a3high  # lowercase letters, numbers, hyphens; max 20 chars; must start with a letter
  a3_static_cluster_size: 3 # supply a3-highgpu-8g reservation size
  a3_partition_name: a3high

  # Additional provisioning models (pick only one), can be used to substitute `a3_reservation_name`:
  #
  # a3_dws_flex_enabled: true
  #
  # To make use of DWS Flex-Start, for more info visit: https://github.com/GoogleCloudPlatform/cluster-toolkit/blob/main/docs/slurm-dws-flex.md
  #
  # a3_enable_spot_vm: true
  #
  # To make use of Spot VMs, for more info visit: https://cloud.google.com/compute/docs/instances/spot
  a3_dws_flex_enabled: false # set this if you want to use DWS Flex
  a3_enable_spot_vm: false # set this if you want to use spot VMs
