---

blueprint_name: a2ultra-slurm-v6

vars:
  # deployment_name:
  # project_id:
  # region:
  # zone:
  # a2_static_cluster_size:
  # a2_dynamic_cluster_size:
  # a2_partition_name:
  # a2_reservation_name:
  # a2_enable_spot_vm:
  # disk_size_gb:
  # sharedfs_size_gb:
  # sharedfs_mount:
  # sharedfs_tier:
  new_image:
    family: $(vars.deployment_name)-slurm-image
    project: $(vars.project_id)

deployment_groups:
- group: primary
  modules:
  - id: network
    source: modules/network/vpc

  # Private Service Access (PSA) requires the compute.networkAdmin role which is
  # included in the Owner role, but not Editor.
  # PSA is a best practice for Filestore instances, but can be optionally
  # removed by deleting the private_service_access module and any references to
  # the module by Filestore modules.
  # https://cloud.google.com/vpc/docs/configure-private-services-access#permissions
  - id: private_service_access
    source: modules/network/private-service-access
    use: [network]

  - id: homefs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: /home
      size_gb: 1024
      filestore_tier: ZONAL

  - id: sharedfs
    source: modules/file-system/filestore
    use: [network, private_service_access]
    settings:
      local_mount: $(vars.sharedfs_mount)
      size_gb: $(vars.sharedfs_size_gb)
      filestore_tier: $(vars.sharedfs_tier)

  - id: script
    source: modules/scripts/startup-script
    settings:
      runners:
      - type: shell
        destination: install-ml-libraries.sh
        content: |
          #!/bin/bash
          # this script is designed to execute on Slurm images published by SchedMD that:
          # - are based on Debian distribution of Linux
          # - have NVIDIA drivers pre-installed

          set -e -o pipefail

          echo "deb https://packages.cloud.google.com/apt google-fast-socket main" > /etc/apt/sources.list.d/google-fast-socket.list
          apt-get update --allow-releaseinfo-change
          apt-get install --assume-yes google-fast-socket

          CONDA_BASE=/opt/conda

          if [ -d $CONDA_BASE ]; then
                  exit 0
          fi

          DL_DIR=\$(mktemp -d)
          cd $DL_DIR
          curl -L -O https://github.com/conda-forge/miniforge/releases/download/24.7.1-2/Miniforge3-24.7.1-2-Linux-x86_64.sh
          HOME=$DL_DIR bash Miniforge3-24.7.1-2-Linux-x86_64.sh -b -p $CONDA_BASE
          cd -
          rm -rf $DL_DIR
          unset DL_DIR

          source $CONDA_BASE/bin/activate base
          conda init --system
          conda config --system --set auto_activate_base False
          # following channel ordering is important! use strict_priority!
          conda config --system --set channel_priority strict
          conda update -n base conda --yes

          ### create a virtual environment for tensorflow
          conda create -n tf python=3.11 --yes
          conda activate tf
          pip install tensorflow[and-cuda]==2.18.*
          pip install tensorrt==10.6.*

          ### create a virtual environment for pytorch
          conda create -n pytorch python=3.11 --yes
          conda activate pytorch
          pip install torch torchvision torchaudio

- group: packer
  modules:
  - id: custom-image
    source: modules/packer/custom-image
    kind: packer
    use:
    - network
    - script
    settings:
      # give VM a public IP to ensure startup script can reach public internet
      # w/o new VPC
      omit_external_ip: false
      source_image_project_id: [schedmd-slurm-public]
      # see latest in https://github.com/GoogleCloudPlatform/slurm-gcp/blob/master/docs/images.md#published-image-family
      source_image_family: slurm-gcp-6-11-debian-12
      # You can find size of source image by using following command
      # gcloud compute images describe-from-family <source_image_family> --project schedmd-slurm-public
      disk_size: $(vars.disk_size_gb)
      disk_type: pd-ssd
      image_family: $(vars.new_image.family)
      # building this image does not require a GPU-enabled VM
      machine_type: c2-standard-4
      state_timeout: 15m

- group: cluster
  modules:
  - id: examples
    source: modules/scripts/startup-script
    settings:
      runners:
      - type: data
        destination: /var/tmp/torch_test.sh
        content: |
          #!/bin/bash
          source /etc/profile.d/conda.sh
          conda activate pytorch
          python3 torch_test.py
      - type: data
        destination: /var/tmp/torch_test.py
        content: |
          import torch
          import torch.utils.benchmark as benchmark

          def batched_dot_mul_sum(a, b):
              '''Computes batched dot by multiplying and summing'''
              return a.mul(b).sum(-1)

          def batched_dot_bmm(a, b):
              '''Computes batched dot by reducing to bmm'''
              a = a.reshape(-1, 1, a.shape[-1])
              b = b.reshape(-1, b.shape[-1], 1)
              return torch.bmm(a, b).flatten(-3)

          # use GPU if available, else CPU
          device = torch.device('cuda' if torch.cuda.is_available() else 'cpu')
          print('Using device:', device)
          if device.type == 'cuda':
              print(torch.cuda.get_device_name(0))

          # benchmarking
          x = torch.randn(10000, 64)
          t0 = benchmark.Timer(
              stmt='batched_dot_mul_sum(x, x)',
              setup='from __main__ import batched_dot_mul_sum',
              globals={'x': x})
          t1 = benchmark.Timer(
              stmt='batched_dot_bmm(x, x)',
              setup='from __main__ import batched_dot_bmm',
              globals={'x': x})
          print(t0.timeit(100))
          print(t1.timeit(100))

  - id: a2_nodeset
    source: community/modules/compute/schedmd-slurm-gcp-v6-nodeset
    use: [network]
    settings:
      node_count_static: $(vars.a2_static_cluster_size)
      node_count_dynamic_max: $(vars.a2_dynamic_cluster_size)
      reservation_name: $(vars.a2_reservation_name)
      enable_spot_vm: $(vars.a2_enable_spot_vm)
      bandwidth_tier: gvnic_enabled
      machine_type: a2-ultragpu-8g
      instance_image: $(vars.new_image)
      disk_type: pd-ssd
      disk_size_gb: $(vars.disk_size_gb)
      node_conf:
        SocketsPerBoard: 2
        CoresPerSocket: 24

  - id: a2_partition
    source: community/modules/compute/schedmd-slurm-gcp-v6-partition
    use: [a2_nodeset]
    settings:
      partition_name: $(vars.a2_partition_name)
      is_default: true
      exclusive: false
      partition_conf:
        DefMemPerGPU: 160000
        DefMemPerCPU: null

  - id: slurm_login
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-login
    use: [network]
    settings:
      enable_login_public_ips: true
      instance_image: $(vars.new_image)

  - id: slurm_controller
    source: community/modules/scheduler/schedmd-slurm-gcp-v6-controller
    use:
    - network
    - a2_partition
    - homefs
    - sharedfs
    - slurm_login
    settings:
      enable_controller_public_ips: true
      instance_image: $(vars.new_image)
      login_startup_script: $(examples.startup_script)
